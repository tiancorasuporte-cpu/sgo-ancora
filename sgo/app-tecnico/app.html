<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#141414">
<meta name="mobile-web-app-capable" content="yes">
<title>App do Técnico · Âncora</title>
<link rel="manifest" href="/tecnico/manifest.webmanifest">
<link rel="icon" href="/tecnico/icone-192.png">
<link rel="stylesheet" href="/tecnico/app.css">
</head>
<body>
<header class="topo">
  <img src="/tecnico/icone-192.png" alt="Âncora Segurança" class="logo">
  <div class="topo-txt">
    <span class="topo-kicker" id="t-kicker">App do Técnico</span>
    <span class="topo-titulo" id="t-titulo">Carregando…</span>
  </div>
  <button type="button" class="topo-menu" id="btn-menu" aria-label="Menu" aria-haspopup="true" aria-expanded="false">
    <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
  </button>
</header>
<button type="button" class="sync" id="sync" aria-live="polite"></button>
<main id="conteudo" tabindex="-1"></main>
<nav class="abas" aria-label="Seções do app">
  <button type="button" data-aba="os" aria-current="page">
    <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.5 2.5-2.4-.6-.6-2.4z"/></svg>
    <span>OS</span><b class="abas-n" id="n-os" hidden></b>
  </button>
  <button type="button" data-aba="estoque">
    <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7l9-4 9 4-9 4-9-4z"/><path d="M3 7v10l9 4 9-4V7M12 11v10"/></svg>
    <span>Estoque</span><b class="abas-n" id="n-est" hidden></b>
  </button>
  <button type="button" data-aba="monit">
    <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>
    <span>Monitoramento</span>
  </button>
</nav>
<div id="menu" class="menu" hidden role="menu">
  <div class="menu-quem" id="menu-quem"></div>
  <button type="button" role="menuitem" id="m-atualizar">Atualizar agora</button>
  <button type="button" role="menuitem" id="m-instalar" hidden>Instalar o app no celular</button>
  <button type="button" role="menuitem" id="m-sair" class="menu-sair">Sair</button>
</div>
<div id="folha" class="folha-fundo" hidden></div>
<div id="aviso" class="aviso" role="status" hidden></div>
<script type="module" src="/tecnico/app.js"></script>
</body>
</html>
