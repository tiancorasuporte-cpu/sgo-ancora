# nginx do SGO em Docker — publicada a porta 8090 (mesma que o tunnel Cloudflare usa).
# Upstream: Bun no host em 127.0.0.1:8091 (PORT=8091 no .env).
services:
  sgo-nginx:
    image: nginx:1.27-alpine
    container_name: sgo-nginx
    restart: unless-stopped
    ports:
      - "8090:8090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./nginx-sgo.conf:/etc/nginx/conf.d/default.conf:ro
